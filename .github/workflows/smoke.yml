# Post-deploy / uptime smoke (postmortem 2026-10-14).
#
# The Oct 10 CORS outage sat red for 4 days because nothing watches prod.
# This runs the shared Go contract checker on a schedule, on demand, and
# after every successful deploy. It asserts health, Centrum public reads,
# the unauthenticated records boundary, CORS preflight, and the retired
# platform alias — the exact surfaces that broke before.
#
# If the production alias ever changes, update PROD_URL below (and only
# there). The endpoint is public and returns status only, no PII.
name: smoke

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]

jobs:
  prod-health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROD_URL: https://agents-proxy-nine.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: true
      - name: contract smoke (3 attempts, 20s apart)
        # Retries are load-bearing: a single sample can catch a cold start
        # mid-wiring. The checker itself retries each surface independently.
        run: |
          go run ./cmd/smoke \
            -base-url "$PROD_URL" \
            -tenant centrum \
            -attempts 3 -retry-delay 20s

  frontend-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CENTRUM_URL: https://centrum-badminton.vercel.app
      DFD_URL: https://dfdagency.vercel.app
    steps:
      - name: probe frontend + API contracts (3 attempts, 20s apart)
        # The Oct 2026 outage was a CORS break that health-only checks
        # missed. Probe the actual data surfaces: Centrum's tenant API and
        # the DFD catalog, not just the HTML shell.
        run: |
          set -euo pipefail
          probe() {
            local name="$1" url="$2" want="$3"
            local ok=0 code body
            body=$(mktemp)
            for i in 1 2 3; do
              code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 25 "$url") || code="000"
              if [ "$code" = "200" ] && { [ -z "$want" ] || grep -q "$want" "$body"; }; then ok=1; break; fi
              echo "$name attempt $i: http=$code — retrying in 20s"
              sleep 20
            done
            echo "$name http=$code attempts_used=$i"
            if [ "$ok" != "1" ]; then
              echo "--- $name body ---"
              head -c 600 "$body" || true
              echo
              return 1
            fi
          }

          probe "centrum root" "$CENTRUM_URL/" ""
          probe "centrum health" "$CENTRUM_URL/api/health" '"configured":true'
          probe "centrum availability" "$CENTRUM_URL/api/availability?date=$(date -u +%F)" '"facilities"'
          probe "dfd catalog" "$DFD_URL/id" ""

  backup-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: verify latest successful backup is under four hours old
        # The schedule is every two hours, but GitHub's scheduler is
        # best-effort. This turns a silently skipped dump into a red smoke
        # run and triggers a replacement backup while still inside a usable
        # recovery window.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ts=$(gh run list --workflow=backup.yml --branch=main --status=success --limit=1 --json createdAt --jq '.[0].createdAt')
          if [ -z "$ts" ] || [ "$ts" = "null" ]; then
            echo "no successful backup run found; triggering backup" >&2
            gh workflow run backup.yml --ref main || true
            exit 1
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$ts" +%s) ))
          echo "latest successful backup: $ts (age ${age}s)"
          if [ "$age" -gt 14400 ]; then
            echo "backup is older than four hours; triggering a new backup" >&2
            gh workflow run backup.yml --ref main || true
            exit 1
          fi

  alert:
    # GitHub Actions red is visible but not a pager. Keep a single open issue
    # as the durable, free-plan alert until an external monitor is confirmed.
    if: |
      always() && (
        needs.prod-health.result == 'failure' ||
        needs.frontend-health.result == 'failure' ||
        needs.backup-freshness.result == 'failure'
      )
    needs: [prod-health, frontend-health, backup-freshness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: open or update the production alert issue
        run: |
          set -euo pipefail
          title="[prod-alert] Production smoke failing"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf 'Smoke workflow failed.\n\nRun: %s\n\nJobs: prod-health=%s frontend-health=%s backup-freshness=%s\n' \
            "$run_url" "${{ needs.prod-health.result }}" "${{ needs.frontend-health.result }}" "${{ needs.backup-freshness.result }}")
          number=$(gh issue list --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "updated issue #$number"
          else
            gh issue create --title "$title" --body "$body"
          fi
