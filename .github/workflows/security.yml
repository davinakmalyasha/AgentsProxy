# security.yml — weekly + on push. govulncheck + gitleaks.
# Mirrors STANDARDS §D and PRD §G.

# DONE: PRD §G (security workflow) / STANDARDS §D, §G
name: security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

permissions:
  contents: read
  security-events: write
  # Declaring any scope sets every unlisted scope to none. gitleaks-action
  # scans the pull request itself on pull_request, which reads the PR's commits
  # through the API; without this it fails 403 "Resource not accessible by
  # integration" before it ever reaches the scan.
  pull-requests: read
  actions: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.27"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run govulncheck
        run: |
          # Pin the scanner: the vulnerability database is live, but the
          # binary should not change under the release gate.
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
        continue-on-error: false

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# codeql: removed 2026-10-04. This repo is private, so code scanning needs
  # GitHub Advanced Security; with it off, the analyze step fails with
  # "Code scanning is not enabled for this repository" and takes the whole
  # workflow red. Restore it when code scanning is enabled, and keep the two
  # details below or it will fail again for the wrong reason:
  #   - build-mode: manual plus an explicit `go build ./...`. Go autobuild
  #     prefers `make`, and this repo's first Makefile target is `run:`
  #     (go run ./cmd/server), which exits non-zero without DATABASE_URL.
  #   - `actions: read` in the permissions above, or the run 403s while
  #     gathering telemetry.
  # Until then govulncheck above covers known CVEs in the Go dependency graph.
