# security.yml — weekly + on push. CodeQL, govulncheck, gitleaks.
# Mirrors STANDARDS §D and PRD §G.

# DONE: PRD §G (security workflow) / STANDARDS §D, §G
name: security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

permissions:
  contents: read
  security-events: write
  # Declaring any scope sets every unlisted scope to none. gitleaks-action
  # scans the pull request itself on pull_request, which reads the PR's commits
  # through the API; without this it fails 403 "Resource not accessible by
  # integration" before it ever reaches the scan. CodeQL also reads the
  # workflow run while gathering telemetry and 403s without this.
  pull-requests: read
  actions: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.27"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: false

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["go"]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Go's autobuild prefers `make` when it finds a Makefile, and this
          # repo's first target is `run:` (go run ./cmd/server), which exits
          # non-zero without DATABASE_URL and failed the analysis before it
          # produced results. Build explicitly. `build-command` in
          # .github/codeql/config.yml is ignored for Go under autobuild.
          build-mode: manual
      - name: Build
        run: go build ./...
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
