# ci.yml — runs on push and PR. Local quality gate equivalent.
# Mirrors the STANDARDS §B checklist: tidy → vet → fmt → test -cover → build.

# DONE: PRD §G (CI workflow) / STANDARDS §G
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  lint-build-test:
    name: lint, build, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_proxy_ci
          # Migration 005 creates `app_runtime LOGIN` with no password, and the
          # RBAC tests rewrite the DSN to that role while keeping the postgres
          # password, so pgx does a SASL handshake as a passwordless role and
          # fails 28P01. Trust auth is for this throwaway container only; it
          # must never be used for a real database.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agents_proxy_ci?sslmode=disable
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/agents_proxy_ci?sslmode=disable
      # Tests read TEST_* only; DATABASE_* belongs to the server/migrate step.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agents_proxy_ci?sslmode=disable
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/agents_proxy_ci?sslmode=disable
      TEST_REDIS_URL: localhost:6379
      REDIS_URL: localhost:6379
      # Tests skip if these aren't set; provide a dummy so the integration
      # tests actually run.
      LLM_API_KEY: test-key
      ADMIN_API_KEY: test-admin-key
      LLM_BASE_URL: http://127.0.0.1:18081
      LLM_MODEL: mock-model
      # mockllm's port is configurable so it can match LLM_BASE_URL above.
      MOCKLLM_ADDR: ":18081"
      MAX_TOKENS_PER_REQUEST: "2048"
      RATE_LIMIT_PER_MINUTE: "60"
      ALLOW_ORIGINS: "*"
      ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod tidy (check)
        run: |
          go mod tidy
          if [[ -n $(git status --porcelain go.mod go.sum) ]]; then
            echo "::error::go.mod or go.sum changed after 'go mod tidy'. Run 'go mod tidy' and commit."
            exit 1
          fi

      - name: gofmt (check, fail on diff)
        run: |
          out=$(gofmt -l .)
          if [[ -n $out ]]; then
            echo "::error::Unformatted files: $out. Run 'go fmt ./...' and commit."
            exit 1
          fi

      - name: migrations additive-DDL lint
        run: bash scripts/lint-migration.sh

      - name: go vet
        run: go vet ./...

      - name: fresh-database migrations
        # Proves the whole embedded chain (platform + every project schema)
        # runs clean on an empty database, not only on the long-lived one.
        run: go run ./cmd/migrate

      - name: go build
        run: go build -v ./...

      - name: generated project imports are current
        run: |
          go run ./cmd/genprojects
          if [[ -n $(git status --porcelain cmd/server/projects_gen.go) ]]; then
            echo "::error::cmd/server/projects_gen.go is stale. Run 'go run ./cmd/genprojects' and commit."
            exit 1
          fi

      - name: tests never read runtime DB env
        # A test suite that reads DATABASE_URL inherits whatever the shell
        # happens to export — including a production DSN. Tests must use
        # TEST_DATABASE_URL / TEST_DATABASE_ADMIN_URL / TEST_REDIS_URL.
        run: |
          hits=$(grep -rn 'os.Getenv("DATABASE_URL")\|os.Getenv("DATABASE_ADMIN_URL")\|os.Getenv("REDIS_URL")' --include='*_test.go' . || true)
          if [[ -n $hits ]]; then
            echo "::error::tests must read TEST_* env only:"
            echo "$hits"
            exit 1
          fi

      - name: go test (with coverage)
        # -p 1: DB-backed packages share one Postgres service; parallel
        # execution races across packages. Mirrors `make test`.
        #
        # mockllm is started here rather than in its own step so the process
        # shares this step's lifetime: the spike tests are skipped when
        # LLM_BASE_URL is unset, but the dummy values above exist to make the
        # integration tests run, so without a server they fail on a refused
        # connection instead.
        run: |
          go build -o /tmp/mockllm ./cmd/mockllm
          /tmp/mockllm &
          for _ in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/18081) 2>/dev/null && break
            sleep 0.5
          done
          go test -p 1 ./... -cover -count=1

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          go test -p 1 ./... -cover -count=1 2>&1 | grep -E "coverage:|ok " >> $GITHUB_STEP_SUMMARY || true
