# db-migrate.yml — the only place production DDL runs.
#
# Production boots with RUN_MIGRATIONS=false. This workflow applies the
# embedded platform chain and every projects/<slug>/migrations/ inside its
# own schema, then verifies the ledger. It is manual and gated by the
# `production` GitHub Environment. GitHub Free does not support required
# reviewers; the environment branch policy (protected branches) plus the
# main-only job condition are the gate. On a plan with reviewers, add them.
#
# Release order: merge the migration-only PR to main, run this workflow,
# then merge the code that depends on the new schema. Additive, backward-
# compatible migrations may ship with their code, but the binary must never
# depend on a column the database does not have yet.
#
# Secret: PROD_DATABASE_ADMIN_URL — the DIRECT 5432 postgres DSN. It is used
# for both DATABASE_URL and DATABASE_ADMIN_URL because cmd/migrate only needs
# the admin connection, and config.Load requires both names to be present.
# Variable: PROD_DB_REF — optional Supabase ref guard (EXPECTED_DB_REF).
name: db-migrate

on:
  workflow_dispatch:
    inputs:
      command:
        description: "apply writes DDL; status/check/plan are read-only"
        type: choice
        options:
          - apply
          - status
          - check
          - plan
        default: apply

permissions:
  contents: read

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    # workflow_dispatch can be started from any branch; production DDL is
    # always built from main. The environment protection is the second gate.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache: true

      - name: Run migration command
        env:
          ENV: production
          EXPECTED_DB_REF: ${{ vars.PROD_DB_REF }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_ADMIN_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.PROD_DATABASE_ADMIN_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_ADMIN_URL" || { echo "PROD_DATABASE_ADMIN_URL is not set"; exit 1; }
          go run ./cmd/migrate "${{ inputs.command }}"

      - name: Verify ledger is clean after apply
        if: inputs.command == 'apply'
        env:
          ENV: production
          EXPECTED_DB_REF: ${{ vars.PROD_DB_REF }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_ADMIN_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.PROD_DATABASE_ADMIN_URL }}
          ALLOW_ORIGINS: https://dfdagency.vercel.app
          LLM_API_KEY: migrate-unused
          ADMIN_API_KEY: migrate-unused
        run: go run ./cmd/migrate check

      - name: Show ledger
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PROD_DATABASE_ADMIN_URL }}
        run: |
          set -euo pipefail
          echo "platform ledger (latest 5):"
          psql "$DATABASE_ADMIN_URL" -Atc \
            "select version from public.schema_migrations order by version desc limit 5"
          echo "project ledger (latest 10):"
          psql "$DATABASE_ADMIN_URL" -Atc \
            "select project_slug || ' ' || version || ' ' || db_schema from public.project_migrations order by applied_at desc limit 10"
