# R18: two-hourly logical backup (ops/backup.sh) + restore smoke.
#
# Independent of the platform's WAL-G daily backups (pitr_enabled=false
# as of 2026-10-18): this dump is restorable anywhere, and the smoke job
# proves it by restoring into a scratch postgres:17 and running sanity
# queries. pg_dump must match the server major (17): installed from PGDG
# in both jobs (17.6+ dumps emit \restrict, which older psql rejects).
#
# Secret: BACKUP_DATABASE_URL — backup_reader credential (migration 062:
# LOGIN BYPASSRLS + pg_read_all_data; BYPASSRLS is REQUIRED or every
# FORCE-RLS tenant table dumps empty), pooler session mode, sslmode=require.
name: backup

on:
  schedule:
    # Every two hours: the free plan has no PITR, so the logical dump is the
    # recovery point. Two offsets reduce the chance that a single delayed
    # GitHub schedule leaves a wide gap. PITR remains the only guaranteed RPO
    # option and is intentionally not enabled on this plan.
    - cron: "0 */2 * * *"
    - cron: "30 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  dump:
    # A workflow_dispatch can name any branch. Production data is only ever
    # dumped from main, and the environment is the second gate on the
    # read-everything backup credential.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Install PostgreSQL 17 client
        # Dearmor as the runner user: `sudo gpg` in a piped step tries to
        # open /dev/tty and dies (observed on the first live run).
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor > /tmp/pgdg.gpg
          sudo install -m 0644 /tmp/pgdg.gpg /usr/share/keyrings/pgdg.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump via ops/backup.sh
        env:
          DATABASE_URL_ADMIN: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_DIR: backups
        run: |
          # pg_wrapper still selects the runner's preinstalled 16 as
          # /usr/bin/pg_dump; pin the 17 binary path explicitly.
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          bash ops/backup.sh
          ls -lh backups/

      - name: Upload dump artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-backup
          path: backups/*.sql.gz
          retention-days: 30
          if-no-files-found: error

  restore-smoke:
    needs: dump
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: db-backup
          path: backups

      - name: Install PostgreSQL 17 client
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor > /tmp/pgdg.gpg
          sudo install -m 0644 /tmp/pgdg.gpg /usr/share/keyrings/pgdg.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Restore + sanity
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          psql --version
          DSN="postgres://postgres:postgres@127.0.0.1:5432/postgres"
          ls -lh backups/
          # App objects reference btree_gist (sports_bookings_no_overlap
          # EXCLUDE constraint: text equality in GiST). The hosted
          # extensions schema is not in the scoped dump; vanilla
          # postgres:17 ships btree_gist contrib. Install it into its own
          # schema — into public it would block the dump's DROP SCHEMA
          # public, and gist/text has exactly one opclass anywhere.
          psql "$DSN" -q -c 'CREATE SCHEMA IF NOT EXISTS ext; CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA ext'
          # The dump carries ownership/ACLs, so every role it names must
          # exist first. This is the same bootstrap the runbook uses.
          psql "$DSN" -v ON_ERROR_STOP=1 -q -f scripts/restore-roles.sql
          # Prod also has pg_cron/pg_net (hosted-only extensions) that the
          # vanilla postgres:17 smoke image cannot install; the platform
          # layer restores those. This smoke proves schema + data:
          gunzip -c backups/*.sql.gz | grep -vE '^(CREATE|COMMENT ON|ALTER) EXTENSION' | psql "$DSN" -v ON_ERROR_STOP=1 -q
          mig=$(psql "$DSN" -tAc "select count(*) from schema_migrations where version like '%.sql'")
          echo "migrations recorded in dump: $mig"
          test "$mig" -ge 50
          # Prove the restore is usable by the runtime role, not only by the
          # restoring superuser. An empty BYPASSRLS-less dump must fail here.
          n=$(psql "$DSN" -v ON_ERROR_STOP=1 -tAc "SET ROLE app_runtime; SELECT count(*) FROM clients" | tail -n 1)
          echo "clients visible to app_runtime: $n"
          test "$n" -gt 0
          n=$(psql "$DSN" -v ON_ERROR_STOP=1 -tAc "SET ROLE app_runtime; SET app.tenant_id='centrum'; SELECT count(*) FROM project_centrum.sports_facilities" | tail -n 1)
          echo "project facilities visible to app_runtime: $n"
          test "$n" -gt 0
          # Report the other high-value tables for the run log; the two
          # assertions above are the release gate.
          for t in tenant_records agent_reminders usage push_subscriptions; do
            n=$(psql "$DSN" -tAc "select count(*) from \"$t\"")
            echo "$t: $n rows"
          done
          n=$(psql "$DSN" -tAc "select count(*) from project_centrum.sports_bookings")
          echo "project_centrum.sports_bookings: $n rows"
